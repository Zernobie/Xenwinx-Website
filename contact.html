<style>
.contact-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; max-width:880px; margin:0 auto; padding:5vh 24px; }
.clink{ display:flex; align-items:center; gap:18px; padding:24px 26px; text-decoration:none; color:inherit; }
.clink .ci{ width:50px; height:50px; flex:0 0 auto; display:grid; place-items:center; border:1px solid var(--teal); border-radius:14px; color:var(--teal); transition:.4s; }
.clink:hover .ci{ background:var(--teal); color:#fff; }
.clink .ct{ font-family:var(--font-display); letter-spacing:.14em; font-size:.66rem; text-transform:uppercase; color:var(--teal-bright); }
.clink .cv{ font-size:1.15rem; color:var(--teal-deep); word-break:break-word; }
.contact-grid .full{ grid-column:1 / -1; }
@media (max-width:620px){ .contact-grid{ grid-template-columns:1fr; } }

body.page-glass .contact-grid .xw-card .ct{ color:#fff !important; }
body.page-glass .contact-grid .xw-card .cv{ color:rgba(255,255,255,.86) !important; }
body.page-glass .contact-grid .xw-card .ci{ color:#fff; border-color:rgba(255,255,255,.5); }
</style>
</head>
